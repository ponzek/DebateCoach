<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Debate — Debate Coach</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .debate-layout { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
    .debate-topbar {
      background: rgba(13,27,42,0.9);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    .topic-display {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      color: var(--text-primary);
      font-style: italic;
      max-width: 500px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .chat-area::-webkit-scrollbar { width: 5px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

    .chat-input-bar {
      background: rgba(13,27,42,0.95);
      border-top: 1px solid var(--border-subtle);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .chat-input {
      flex: 1;
      background: rgba(26,45,66,0.8);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 0.93rem;
      padding: 0.75rem 1.1rem;
      outline: none;
      resize: none;
      max-height: 140px;
      min-height: 44px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .chat-input:focus { border-color: var(--gold); }
    .chat-input::placeholder { color: var(--text-muted); }

    .send-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--navy);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.08); box-shadow: 0 4px 16px rgba(201,168,76,0.35); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .exchange-counter {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .exchange-counter span { color: var(--gold); font-weight: 700; }

    .welcome-msg {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--text-secondary);
    }
    .welcome-msg h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.3rem;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
    }

    .end-debate-wrap {
      text-align: center;
      padding: 0.5rem 0 0.25rem;
    }
    .btn-end-disabled {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">
      <div class="site-logo-icon">⚖️</div>
      <span class="site-logo-text">Debate<span>Coach</span></span>
    </a>
    <nav class="site-nav">
      <span id="conditionBadge" class="badge badge-b">Condition B</span>
      <a href="/" class="btn btn-ghost" style="padding:0.4rem 0.9rem;font-size:0.8rem;">← New Debate</a>
    </nav>
  </header>

  <div class="debate-layout">
    <div class="debate-topbar">
      <div>
        <div style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:2px;">Topic</div>
        <div class="topic-display" id="topicDisplay">Loading…</div>
      </div>
      <div style="display:flex;align-items:center;gap:1rem;">
        <div class="exchange-counter">Exchanges: <span id="exchangeCount">0</span>/3 min</div>
        <button class="btn btn-danger btn-end-disabled" id="endBtn" onclick="endDebate()">End Debate ⟶</button>
      </div>
    </div>

    <div class="chat-area" id="chatArea">
      <div class="welcome-msg" id="welcomeMsg">
        <h2>Your debate partner is ready.</h2>
        <p>State your position on the topic and the AI will argue the other side.<br/>Challenge it — it's here to make you think harder.</p>
      </div>
    </div>

    <div class="chat-input-bar">
      <textarea class="chat-input" id="chatInput" placeholder="State your argument…" rows="1" onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Send">➤</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('s');
    const state = JSON.parse(localStorage.getItem('debate_session_' + sessionId) || '{}');

    let messages = [];
    let exchanges = 0;
    let isStreaming = false;

    // Init UI
    document.getElementById('topicDisplay').textContent = `"${state.topic || 'Unknown topic'}"`;
    const condBadge = document.getElementById('conditionBadge');
    const condLabels = { A: 'Condition A — Vanilla', B: 'Condition B — Prompted', C: 'Condition C — Fine-tuned' };
    const condClasses = { A: 'badge-a', B: 'badge-b', C: 'badge-c' };
    condBadge.textContent = condLabels[state.condition] || 'Unknown';
    condBadge.className = `badge ${condClasses[state.condition] || 'badge-b'}`;

    // Auto-resize textarea
    const input = document.getElementById('chatInput');
    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    function handleKey(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }

    function renderMessage(role, content, streaming = false) {
      const chatArea = document.getElementById('chatArea');
      const welcome = document.getElementById('welcomeMsg');
      if (welcome) welcome.remove();

      const isUser = role === 'user';
      const div = document.createElement('div');
      div.className = `message ${isUser ? 'message-user' : 'message-ai'}`;
      div.id = streaming ? 'streaming-msg' : '';

      const avatar = document.createElement('div');
      avatar.className = 'message-avatar';
      avatar.textContent = isUser ? '👤' : '⚖️';

      const bubble = document.createElement('div');
      bubble.className = 'message-bubble';
      bubble.textContent = content;
      bubble.id = streaming ? 'streaming-bubble' : '';

      const meta = document.createElement('div');
      meta.className = 'message-meta';
      meta.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      const inner = document.createElement('div');
      inner.appendChild(bubble);
      inner.appendChild(meta);

      div.appendChild(avatar);
      div.appendChild(inner);
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return bubble;
    }

    function showTyping() {
      const chatArea = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'message message-ai';
      div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="message-avatar">⚖️</div>
        <div class="message-bubble">
          <div class="typing-indicator">
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
            <div class="typing-dot"></div>
          </div>
        </div>`;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      if (isStreaming) return;
      const content = input.value.trim();
      if (!content) return;

      isStreaming = true;
      input.value = '';
      input.style.height = 'auto';
      document.getElementById('sendBtn').disabled = true;

      messages.push({ role: 'user', content });
      renderMessage('user', content);

      showTyping();

      try {
        const resp = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages, topic: state.topic, condition: state.condition })
        });

        removeTyping();

        if (!resp.ok) throw new Error('API error ' + resp.status);

        const bubble = renderMessage('assistant', '', true);
        let aiText = '';

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const text = decoder.decode(value);
          const lines = text.split('\n');
          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') break;
              try {
                const { delta, error } = JSON.parse(data);
                if (error) throw new Error(error);
                if (delta) { aiText += delta; bubble.textContent = aiText; }
                document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
              } catch {}
            }
          }
        }

        document.getElementById('streaming-msg')?.removeAttribute('id');
        document.getElementById('streaming-bubble')?.removeAttribute('id');

        messages.push({ role: 'assistant', content: aiText });
        exchanges++;
        document.getElementById('exchangeCount').textContent = exchanges;

        if (exchanges >= 3) {
          document.getElementById('endBtn').classList.remove('btn-end-disabled');
        }

      } catch (err) {
        removeTyping();
        renderMessage('assistant', '⚠️ Error: ' + err.message);
      } finally {
        isStreaming = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
      }
    }

    function endDebate() {
      if (exchanges < 3) return;
      state.messages = messages;
      state.endedAt = new Date().toISOString();
      localStorage.setItem('debate_session_' + sessionId, JSON.stringify(state));
      window.location.href = '/reflect.html?s=' + sessionId;
    }
  </script>
</body>
</html>
