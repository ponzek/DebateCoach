<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete — Debate Coach</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    .complete-layout { max-width: 600px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
    .success-icon {
      width: 80px; height: 80px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(201,168,76,0.3);
    }
    .complete-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .session-id-display {
      background: rgba(13,27,42,0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.75rem 1.25rem;
      font-family: monospace;
      font-size: 0.9rem;
      color: var(--gold);
      margin: 1rem 0 1.5rem;
      display: inline-block;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.75rem;
      margin: 1.5rem 0;
      text-align: left;
    }
    .summary-cell {
      background: rgba(26,45,66,0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.9rem 1rem;
    }
    .summary-label { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.2rem; }
    .summary-value { font-size: 1.1rem; font-weight: 700; color: var(--text-primary); }
    .score-stars { color: var(--gold); }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">
      <div class="site-logo-icon">⚖️</div>
      <span class="site-logo-text">Debate<span>Coach</span></span>
    </a>
    <nav class="site-nav">
      <a href="/admin.html">Research Dashboard</a>
    </nav>
  </header>

  <div class="complete-layout">
    <div class="success-icon">✓</div>
    <h1 class="complete-title">Session Complete</h1>
    <p style="color:var(--text-secondary);font-size:1rem;margin-bottom:0.5rem;">Thank you for participating in the Debate Coach study.</p>
    <p style="font-size:0.82rem;color:var(--text-muted);">Your session ID (for records):</p>
    <div class="session-id-display" id="sessionIdDisplay">—</div>

    <div id="summaryGrid" class="summary-grid" style="display:none;"></div>

    <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1rem;">
      <a href="/" class="btn btn-primary" style="justify-content:center;">Start Another Debate</a>
      <a href="/admin.html" class="btn btn-ghost" style="justify-content:center;">View Research Dashboard</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('s');

    document.getElementById('sessionIdDisplay').textContent = sessionId || '—';

    // Try to load this session's data to show a summary
    async function loadSummary() {
      if (!sessionId) return;
      try {
        const resp = await fetch('/api/sessions');
        const sessions = await resp.json();
        const session = sessions.find(s => s.sessionId === sessionId);
        if (!session?.survey) return;

        const grid = document.getElementById('summaryGrid');
        grid.style.display = 'grid';
        const s = session.survey;

        const items = [
          { label: 'Stance Reconsideration', value: s.stanceReconsideration },
          { label: 'Perceived Fairness', value: s.perceivedFairness },
          { label: 'Helpfulness', value: s.helpfulness },
          { label: 'Frustration', value: s.frustration },
        ];

        items.forEach(item => {
          const cell = document.createElement('div');
          cell.className = 'summary-cell';
          cell.innerHTML = `
            <div class="summary-label">${item.label}</div>
            <div class="summary-value">${item.value}/5 <span class="score-stars">${'★'.repeat(item.value)}${'☆'.repeat(5 - item.value)}</span></div>`;
          grid.appendChild(cell);
        });

        // Condition
        const condNames = { A: 'Vanilla GPT-4o', B: 'Prompted', C: 'Fine-tuned' };
        const condCell = document.createElement('div');
        condCell.className = 'summary-cell';
        condCell.innerHTML = `<div class="summary-label">Condition</div><div class="summary-value">${condNames[session.condition] || session.condition}</div>`;
        grid.appendChild(condCell);

        const topicCell = document.createElement('div');
        topicCell.className = 'summary-cell';
        topicCell.innerHTML = `<div class="summary-label">Topic</div><div class="summary-value" style="font-size:0.85rem;">${session.topic}</div>`;
        grid.appendChild(topicCell);
      } catch {}
    }
    loadSummary();
  </script>
</body>
</html>
