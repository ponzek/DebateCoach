<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete - Debate Coach</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    body { overflow-x: hidden; }
    .complete-layout { max-width: 600px; margin: 0 auto; padding: 4rem 1.5rem; text-align: center; }
    .success-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(201,168,76,0.28);
    }
    .complete-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .session-id-display {
      background: rgba(13,27,42,0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 1.1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--gold);
      margin: 0.75rem 0 1.5rem;
      display: inline-block;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
      margin: 1.5rem 0;
      text-align: left;
    }
    @media (max-width: 500px) { .summary-grid { grid-template-columns: repeat(2, 1fr); } }
    .summary-cell {
      background: rgba(26,45,66,0.6);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.85rem 1rem;
    }
    .summary-label { font-size: 0.68rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.25rem; }
    .summary-cond { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.2rem; }
    .summary-cond-a { color: var(--green); }
    .summary-cond-b { color: var(--gold); }
    .summary-cond-c { color: #a78bfa; }
    .summary-value { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
    .score-stars { color: var(--gold); font-size: 0.8rem; }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo">
      <div class="site-logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="url(#lg4)"/>
          <line x1="18" y1="8" x2="18" y2="26" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="11" y1="28" x2="25" y2="28" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="18" y1="11" x2="10" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="18" y1="11" x2="26" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6 15 Q10 22 14 15" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M22 15 Q26 22 30 15" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <defs>
            <linearGradient id="lg4" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#c9a84c"/><stop offset="1" stop-color="#e8c76a"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="site-logo-text">Debate<span>Coach</span></span>
    </a>
    <nav class="site-nav">
      <a href="/admin.html">Research Dashboard</a>
    </nav>
  </header>

  <div class="complete-layout">
    <div class="success-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 class="complete-title">Session Complete</h1>
    <p style="color:var(--text-secondary);font-size:1rem;margin-bottom:0.5rem;">Thank you for participating in the Debate Coach study.</p>
    <div id="summaryGrid" class="summary-grid" style="display:none;"></div>

    <div style="display:flex;flex-direction:column;gap:0.75rem;margin-top:1.25rem;">
      <a href="/" class="btn btn-primary" style="justify-content:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
        Start Another Debate
      </a>
      <a href="/admin.html" class="btn btn-ghost" style="justify-content:center;">View Research Dashboard</a>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get('s');

    document.getElementById('sessionIdDisplay').textContent = sessionId || '-';

    async function loadSummary() {
      if (!sessionId) return;
      try {
        const resp = await fetch('/api/sessions');
        const sessions = await resp.json();

        // Find all sessions from this participant (same savedAt proximity - last 3)
        const thisSession = sessions.find(s => s.sessionId === sessionId);
        if (!thisSession) return;

        const participantId = thisSession.participantId;
        const participantSessions = sessions.filter(s => s.participantId === participantId);

        const grid = document.getElementById('summaryGrid');
        grid.style.display = 'grid';

        const condNames = { A: 'Vanilla', B: 'Prompted', C: 'Fine-tuned' };
        const condClass = { A: 'summary-cond-a', B: 'summary-cond-b', C: 'summary-cond-c' };
        const metrics = [
          { key: 'stanceReconsideration', label: 'Stance Shift' },
          { key: 'perceivedFairness', label: 'Fairness' },
          { key: 'helpfulness', label: 'Helpfulness' },
          { key: 'frustration', label: 'Frustration' }
        ];

        ['A', 'B', 'C'].forEach(cond => {
          const s = participantSessions.find(p => p.condition === cond);
          if (!s?.survey) return;

          metrics.forEach(m => {
            const val = s.survey[m.key];
            if (val == null) return;
            const cell = document.createElement('div');
            cell.className = 'summary-cell';
            cell.innerHTML = `
              <div class="summary-cond ${condClass[cond]}">${cond} - ${condNames[cond]}</div>
              <div class="summary-label">${m.label}</div>
              <div class="summary-value">${val}/5 <span class="score-stars">${'*'.repeat(val)}${'·'.repeat(5 - val)}</span></div>`;
            grid.appendChild(cell);
          });
        });

        if (grid.children.length === 0) grid.style.display = 'none';
      } catch {}
    }

    loadSummary();
  </script>
  <script src="/dev-tools.js"></script>
</body>
</html>
