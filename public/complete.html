<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Complete - Debate Coach</title>
  <link rel="stylesheet" href="/style.css"/>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; overflow-x: hidden; }
    .complete-layout { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; max-width: 600px; margin: 0 auto; padding: 1.5rem; text-align: center; }
    .success-icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(201,168,76,0.28);
    }
    .complete-title {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      margin-bottom: 0.75rem;
    }
    .participant-id-display {
      background: rgba(13,27,42,0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.6rem 1.1rem;
      font-family: monospace;
      font-size: 0.85rem;
      color: var(--gold);
      margin: 0.75rem 0 1.5rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a href="/" class="site-logo" onclick="handleLogoClick(event)">
      <div class="site-logo-icon">
        <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
          <rect width="36" height="36" rx="10" fill="url(#lg4)"/>
          <line x1="18" y1="8" x2="18" y2="26" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="11" y1="28" x2="25" y2="28" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
          <line x1="18" y1="11" x2="10" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="18" y1="11" x2="26" y2="15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6 15 Q10 22 14 15" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M22 15 Q26 22 30 15" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <defs>
            <linearGradient id="lg4" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="#c9a84c"/><stop offset="1" stop-color="#e8c76a"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <span class="site-logo-text">Debate<span>Coach</span></span>
    </a>
  </header>

  <div class="complete-layout">
    <div class="success-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--navy)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1 class="complete-title">Session Complete</h1>
    <p style="color:var(--text-secondary);font-size:1rem;margin-bottom:0.5rem;">Thank you for participating in the Debate Coach study.</p>
    <p style="color:var(--text-muted);font-size:0.88rem;line-height:1.6;margin-bottom:1.5rem;">Your responses have been recorded. You completed all 3 debate rounds and surveys. Your participation helps us understand how different AI configurations affect debate quality.</p>
    <div id="participantDisplay" class="participant-id-display" style="display:none;"></div>
    <div style="margin-top: 1rem;">
      <a href="/" class="btn btn-primary">Back to Home</a>
    </div>
  </div>

  <script>
    function handleLogoClick(e) {
      e.preventDefault();
      localStorage.removeItem('dc_participant_id');
      localStorage.removeItem('dc_participant_state');
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (key && key.startsWith('debate_session_')) {
          localStorage.removeItem(key);
          i--;
        }
      }
      window.location.href = '/';
    }

    // Show participant ID if available
    const ps = JSON.parse(localStorage.getItem('dc_participant_state') || '{}');
    if (ps.participantId) {
      const display = document.getElementById('participantDisplay');
      display.textContent = 'Participant ID: ' + ps.participantId;
      display.style.display = 'inline-block';
    }
  </script>
  <script src="/dev-tools.js"></script>
</body>
</html>
